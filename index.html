<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Smart Traffic Control</title>
  <link rel="icon" href="data:," />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: Arial, sans-serif; background-color: #0b1020; touch-action: none; }
    #game-container { width: 100%; height: 100%; }
    /* aviso para rodar o telemóvel: só aparece em ecrãs táteis na vertical */
    #rodar { display: none; position: fixed; inset: 0; z-index: 10; background: #0b1020; color: #e8e6df;
             font: bold 20px 'Trebuchet MS', Arial, sans-serif; text-align: center;
             flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
    #rodar .icone { font-size: 64px; display: inline-block; animation: rodar 2s ease-in-out infinite; }
    @keyframes rodar { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rodar { display: flex; } }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="rodar"><span class="icone">📱</span>Roda o telemóvel para jogar na horizontal</div>
  <script src="./phaser.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
